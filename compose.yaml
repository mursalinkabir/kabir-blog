# Local Postgres for Payload development. The cluster's pg-main runs PostgreSQL 16.15 (CNPG), so dev uses 16.
# Never point this at production; credentials here are for a throwaway local database.
services:
  postgres:
    image: postgres:16-alpine
    container_name: smkabir-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload-dev-only
      POSTGRES_DB: payload
    ports:
      - '127.0.0.1:5433:5432' # 5433: leaves 5432 free if you run another Postgres locally
    volumes:
      - payload-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d payload']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  payload-pgdata:
