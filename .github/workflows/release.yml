# Code release: a vX.Y.Z tag builds the server image and pushes it to GHCR. It does NOT deploy.
# Deployment is a hand-made tag bump in homelab-terraform (prod/apps/blog/), exactly like TraderBuddy.
# Rollback is `git revert` of that bump. Tags are never moved: a mistake ships as the next patch.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/smkabir-site-server

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: CHANGELOG has an entry for this tag (written before the tag was pushed)
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -Eq "^## \[?${version}\]?( |$)" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## ${version}' heading. Write the entry, then tag the next patch."
            exit 1
          }

      - name: Rendered headers match security-headers.json
        run: node apps/server/scripts/render-headers.mjs --check

      - name: Image tests (sidecar, nginx under the cluster's restrictions, redirects reload)
        run: bash apps/server/tests/run.sh

      - name: Release script tests (against a fake bucket)
        run: |
          docker run --rm -u 0 -v "$PWD/scripts/ci:/ci:ro" --entrypoint sh smkabir-site-server:test /ci/test-release.sh

  image:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite a published version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if docker manifest inspect "${IMAGE}:${version}" >/dev/null 2>&1; then
            echo "::error::${IMAGE}:${version} already exists. Tags are never moved; release the next patch."
            exit 1
          fi

      # linux/amd64 explicitly: the nodes are Intel N100s, whatever the runner is.
      - name: Build (not pushed yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/server
          platforms: linux/amd64
          load: true
          push: false
          tags: scan-target:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan (fixable HIGH and CRITICAL fail the release)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan-target:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: 'Push (version tag only, there is no `latest`)'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/server
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Next step
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "### Image pushed"
            echo ""
            echo "\`${IMAGE}:${version}\`"
            echo ""
            echo "Deploy it by hand in homelab-terraform: set that tag on the \`blog\` Deployment (both containers) in"
            echo "\`prod/apps/blog/blog.yaml\`, commit, push, and watch Argo CD reach Synced/Healthy."
            echo "Roll back with \`git revert\` of that commit."
          } >> "$GITHUB_STEP_SUMMARY"
