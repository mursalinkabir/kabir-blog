# nginx for smkabir-site-server. Runs as uid 101 on 8080 with a read-only root filesystem:
# the only writable paths are /tmp (pid, temp files) and /srv/site (content, filled by the sidecar).
worker_processes 1;            # a static site behind Cloudflare; one worker keeps memory flat
error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Every temp path under /tmp (the image default tree is not writable here).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server_tokens off;

    log_format main '$remote_addr "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" cf=$http_cf_ray';
    access_log /var/log/nginx/access.log main;

    sendfile   on;
    keepalive_timeout 65;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 512;
    gzip_types      text/css application/javascript application/json application/xml text/xml
                    image/svg+xml application/rss+xml text/plain;

    include /etc/nginx/conf.d/*.conf;
}
