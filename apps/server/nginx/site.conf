# The public site. Content is NOT in the image: the content-sync sidecar fills /srv/site/<build_id>/ and
# swaps the /srv/site/current symlink atomically. See docs/deploy.md.

# Redirects for URLs that moved. The sidecar renders /srv/site/_redirects.conf from the release's
# _redirects.json (lines of `"/old/" "/new/";`) and signals nginx to reload. It lives outside `current`
# so nginx can always start, even before the first release has been downloaded.
map $uri $redirect_target {
    default "";
    include /srv/site/_redirects.conf;
}

server {
    listen 8080 default_server;
    server_name _;

    root  /srv/site/current;
    index index.html;

    # Otherwise directory redirects leak :8080 (and the in-cluster host) through the tunnel.
    absolute_redirect off;
    port_in_redirect  off;

    include /etc/nginx/snippets/security-headers.conf;

    error_page 404 /404.html;

    # Liveness: nginx answers itself, so a pod with no content yet is alive (just not ready).
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 "ok\n";
    }

    # Readiness: 200 only once a release is in place. CI also polls this to see which release is live.
    location = /version.json {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /version.json =404;
    }

    # Astro's hashed build output never changes under the same name.
    # `^~` matters: without it the extension regex below would win and give these files the short policy.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Images, fonts and other static files keep their names between releases, so a short browser cache;
    # Cloudflare holds them longer and is purged on publish.
    location ~* \.(?:webp|avif|jpe?g|png|gif|svg|ico|woff2?|css|js|mjs|pdf)$ {
        add_header Cache-Control "public, max-age=3600, s-maxage=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # The custom 404 page is served with a 404 status and must not be cached as a success anywhere.
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # HTML, feeds, sitemap, search index: always revalidate in browsers; the edge may keep a day
    # (it is purged on every publish).
    location / {
        if ($redirect_target) {
            return 301 $redirect_target;
        }
        add_header Cache-Control "public, max-age=0, s-maxage=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ $uri.html =404;
    }
}
