# ILLUSTRATIVE: stage this in a dedicated scratch namespace through GitOps. Match the source PostgreSQL major version
# and size storage for the full backup. Use a namespace-local ObjectStore and read-only backup credentials.
# Keep WAL archiving disabled for the scratch cluster.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-restore-test
spec:
  instances: 1
  storage: { size: 5Gi }
  bootstrap:
    recovery:
      source: pg-main
  externalClusters:
    - name: pg-main
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: pg-main-r2
          serverName: pg-main
