# smkabir.com CMS (Payload) AND the public site: this one app serves both hostnames. DRAFT: lives in kabir-blog/deploy/ until copied into homelab-terraform/prod/apps/cms/
# by hand (the site repo holds no GitOps credentials, by design). Production-ready once the image tag exists.
#
# Deployed by the `apps` ApplicationSet into namespace `cms` (the folder name), which is why nothing below sets
# metadata.namespace. The namespace enforces PodSecurity `restricted`.
#
# ONE replica, strategy Recreate, and it must stay one: the public site is served from an in-memory copy of the content
# that a hook refreshes inside this process (a second replica would show stale pages until its own copy expired).
# Payload also applies its committed migrations when the first /readyz probe connects, so there must never be two
# migrators. A restart (~10-20 s) means smkabir.com is briefly unavailable: acceptable for this site (decided 2026-11-11).
#
# It is not reachable until you add a tunnel route for cms.smkabir.com, and it refuses every request except /healthz
# and /readyz until CF_ACCESS_TEAM_DOMAIN and CF_ACCESS_AUD below name the Access application. Create the Access
# application first, then fill those two values, then add the route. (docs/deploy.md, "The CMS service".)
#
# A code release is a tag push in kabir-blog (v0.3.3 -> ghcr.io/mursalinkabir/kabir-blog-cms:0.3.3) plus a hand-made
# bump of the `image:` line below. Rollback is `git revert` of that bump.
#
# Secrets (all SealedSecrets in this folder):
#   cms-app     PAYLOAD_SECRET, DATABASE_URL            sealed by deploy/.../seal-cms-core.sh
#   cms-media   S3_BUCKET, S3_ENDPOINT, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY      seal-cms-extras.sh (optional)
# cms-media is `optional: true`: without it the CMS keeps uploads on local disk (lost on restart) and the public site's
# image URLs would point at the hidden /api/ path, so /version.json would report them. Pods do not restart when a Secret
# changes: bump the `secrets-rev` annotation on the pod template below in the same commit.
# There is no cms-github any more: nothing is rebuilt when content changes. Delete the old SealedSecret and revoke its token.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cms-config
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
data:
  CMS_PUBLIC_URL: 'https://cms.smkabir.com'
  MEDIA_PUBLIC_URL: 'https://media.smkabir.com'
  # The hostnames that serve the PUBLIC site (pages only; /admin, /api and /preview answer 404 there). Any other hostname,
  # or none, is the CMS hostname and needs the Cloudflare Access assertion. Comma separated.
  SITE_PUBLIC_HOSTS: 'smkabir.com'
  # The kill switch for agent publishing. Anything but exactly "1" means an agent can write drafts, not publish.
  # YOUR DECISION: a publish is public within a second now, so '1' lets the agent change smkabir.com without a person
  # reading it first. Left at '0' here; set '1' only when you want that.
  AGENT_AUTO_PUBLISH: '0'
  # The Access application. Empty = the CMS answers 503 to everything but the probes (fails closed).
  # Zero Trust team domain, and the AUD tag of the "cms" application (covers cms.smkabir.com only; add preview.smkabir.com to the app when it has DNS and a route).
  # Neither is a secret. Created 2026-10-17.
  CF_ACCESS_TEAM_DOMAIN: 'kabirlab.cloudflareaccess.com'
  CF_ACCESS_AUD: '418f571b27ba6ffe19a262a72a9eb823f03a75b52fa1c58c2bc37a36afba65ef'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cms
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: cms }
  template:
    metadata:
      labels: { app: cms }
      annotations:
        # Bump when cms-media changes (pods do not restart on a Secret change).
        kabir-blog/secrets-rev: '2' # cms-media sealed 2026-10-17
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Numeric on purpose: the kubelet cannot prove a *named* user is non-root.
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      # Not on prod-1: it is the smallest node and carries an etcd member and the control-plane VIP
      # (see prod/data-platform/03-cnpg-cluster.yaml for the same reasoning).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - { key: kubernetes.io/hostname, operator: NotIn, values: ['prod-1'] }
      containers:
        - name: cms
          image: ghcr.io/mursalinkabir/kabir-blog-cms:0.3.3 # bump with each CMS release
          ports:
            - { name: http, containerPort: 3100 }
          envFrom:
            - configMapRef: { name: cms-config }
            - secretRef: { name: cms-app }
            - secretRef: { name: cms-media, optional: true }
          # Liveness answers from the proxy, so a pod stuck waiting for the database is alive but not ready.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          # Readiness runs Payload's init (which applies migrations) and one database query.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          # Migrations on first start can take longer than a steady-state probe window.
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 36
          resources:
            requests: { cpu: 100m, memory: 512Mi } # it now renders every page too; check `kubectl top pod` after the switch
            limits: { memory: 1Gi } # no CPU limit: neither the admin nor a page should be throttled
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
          volumeMounts:
            - { name: next-cache, mountPath: /app/apps/cms/.next/cache }
            - { name: media, mountPath: /app/apps/cms/media }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: next-cache, emptyDir: { sizeLimit: 256Mi } }
        - { name: media, emptyDir: { sizeLimit: 512Mi } } # only used while cms-media is absent
        - { name: tmp, emptyDir: { sizeLimit: 128Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: cms
spec:
  type: ClusterIP
  selector: { app: cms }
  ports:
    - { name: http, port: 80, targetPort: http, protocol: TCP }
---
# The cluster half of the hostname binding. The other half is the tunnel route, added only AFTER the Access
# application exists. A wildcard subdomain uses the Gateway's `https-wildcard` listener (cms.smkabir.com is covered
# by smkabir-wildcard-tls).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cms
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https-wildcard
  hostnames:
    - 'cms.smkabir.com'
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { name: cms, port: 80 }
---
# The public hostname. Added to the SAME Service: the app tells the two hostnames apart by the Host header (see
# SITE_PUBLIC_HOSTS above). It replaces the `blog` route in prod/apps/blog/blog.yaml: a hostname has one route, so the
# switch is ONE commit that adds this and removes that (docs/cutover.md, step 7). Rollback is `git revert` of it.
# `https-apex` is the Gateway listener for smkabir.com itself (not the wildcard), and its allowedRoutes must admit the
# `cms` namespace, as it admits `blog` today: check that before the switch.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cms-public
spec:
  parentRefs:
    - name: public
      namespace: gateway
      sectionName: https-apex
  hostnames:
    - 'smkabir.com'
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { name: cms, port: 80 }
